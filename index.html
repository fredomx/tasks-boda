<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>m&a — checklist de boda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --canario:#FFE36B; --bugambilia:#E56AA6; --cielo:#7EC1E8; --profundo:#B02F74;
  --tinta:#1A1426; --cal:#FBF8F1; --suave:#5E5868; --plata:#C7C9CC;
  --bg:var(--cal); --fg:var(--tinta); --muted:var(--suave); --line:rgba(26,20,38,.12); --card:#fff;
  --sans:"Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif:"Instrument Serif", Georgia, "Times New Roman", serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#1A1426; --fg:#FBF8F1; --muted:#B9B3C4; --line:rgba(251,248,241,.14); --card:#241D33; }
}
:root[data-theme="dark"]{ --bg:#1A1426; --fg:#FBF8F1; --muted:#B9B3C4; --line:rgba(251,248,241,.14); --card:#241D33; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:28px 20px 80px}

/* Header */
.sig{display:flex;align-items:baseline;gap:.15em;font-size:clamp(44px,11vw,84px);line-height:.9;letter-spacing:-.02em;margin:0 0 14px}
.sig .m{font-family:var(--serif);font-style:italic;font-weight:400}
.sig .amp{font-family:var(--serif);color:var(--profundo);font-size:1.25em;line-height:.7}
.sig .a{font-family:var(--sans);font-weight:800}
.sub{font-family:var(--serif);font-size:22px;margin:0 0 22px;color:var(--muted)}
.sub b{font-family:var(--sans);font-weight:800;color:var(--fg);font-size:.8em}

.meter{position:relative;height:54px;border:2px solid var(--fg);border-radius:999px;overflow:hidden;background:var(--card)}
.meter .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--canario);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.meter .txt{position:relative;display:flex;justify-content:space-between;align-items:center;height:100%;padding:0 20px;font-weight:800;color:var(--tinta)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .meter .txt{color:var(--fg)} }
.meter .txt span:last-child{font-weight:600}
.sync{font-size:13px;color:var(--muted);margin:8px 4px 0}

/* Controls */
.controls{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:16px 0 12px;margin-top:10px;border-bottom:1px solid var(--line)}
.chip{font:600 14px var(--sans);border:1.5px solid var(--fg);background:transparent;color:var(--fg);padding:7px 14px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.chip:focus-visible,.row:focus-visible{outline:3px solid var(--cielo);outline-offset:2px}
.toggle{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;user-select:none}
.toggle input{accent-color:var(--profundo);width:18px;height:18px}

/* Sections */
section{margin-top:34px}
section.urg{background:var(--canario);color:var(--tinta);border-radius:22px;padding:18px 16px 8px;margin-left:-8px;margin-right:-8px}
section.urg .note{color:#5E5868}
h2{display:flex;align-items:baseline;gap:10px;font-size:26px;font-weight:800;letter-spacing:-.01em;margin:0 0 8px}
h2 .count{font:400 20px var(--serif);font-style:italic;color:inherit;opacity:.65}
h2 .done-tag{font:600 13px var(--sans);background:var(--profundo);color:#fff;border-radius:999px;padding:3px 10px;transform:scale(0);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
section.complete h2 .done-tag{transform:scale(1)}

ul{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:start;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:10px;-webkit-tap-highlight-color:transparent}
section.urg .row{border-color:rgba(26,20,38,.15)}
.row:last-child{border-bottom:0}
.box{width:28px;height:28px;border:2px solid currentColor;border-radius:50%;display:grid;place-items:center;transition:background .2s,border-color .2s,transform .2s}
.box svg{width:16px;height:16px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .25s ease .05s}
.row.done .box{background:var(--profundo);border-color:var(--profundo);animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.row.done .box svg{stroke-dashoffset:0}
@keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}
.task{position:relative;font-size:16px;font-weight:600;align-self:center}
.task .t{background-image:linear-gradient(currentColor,currentColor);background-repeat:no-repeat;background-position:0 55%;background-size:0 2px;transition:background-size .3s ease,opacity .3s}
.row.done .task .t{background-size:100% 2px;opacity:.45}
.note{display:block;font-weight:400;font-size:14px;color:var(--muted);margin-top:2px}
.who{font:600 12px var(--sans);border-radius:999px;padding:3px 9px;white-space:nowrap;margin-top:4px;color:var(--tinta)}
.who.A{background:var(--cielo)} .who.M{background:var(--bugambilia)} .who.AM{background:var(--canario)}
section.urg .who.AM{background:#fff}
.who.N{background:transparent;border:1.5px dashed var(--plata);color:var(--muted)}
.help{display:block;font-size:13px;font-weight:600;margin-top:4px;color:var(--profundo)}
section.urg .help{color:#B02F74}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .help{color:var(--bugambilia)} }
.hrow{display:flex;gap:6px;align-items:center;width:100%;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.hrow::-webkit-scrollbar{display:none}
.hrow .lbl{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--muted);white-space:nowrap;margin-right:2px}
.hrow .chip{font-size:13px;padding:5px 11px;white-space:nowrap;border-color:var(--bugambilia)}
.hrow .chip[aria-pressed="true"]{background:var(--bugambilia);color:var(--tinta);border-color:var(--bugambilia)}
.drow .chip{border-color:var(--cielo)}
.drow .chip[aria-pressed="true"]{background:var(--cielo);color:var(--tinta);border-color:var(--cielo)}
.drow .chip .hoy{font:400 12px var(--serif);font-style:italic;opacity:.75}
.dia{display:inline-block;font:600 12px var(--sans);border:1.5px solid var(--cielo);border-radius:999px;padding:1px 8px;margin-top:4px}
.rrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;width:100%}
.addbtn{font:800 16px var(--sans);background:var(--fg);color:var(--bg);border:0;border-radius:999px;padding:12px 20px;cursor:pointer;margin-top:14px}
.addbtn:focus-visible,.form button:focus-visible,.form input:focus-visible,.form select:focus-visible,.act:focus-visible{outline:3px solid var(--cielo);outline-offset:2px}
.form{display:none;margin-top:14px;background:var(--card);border:2px solid var(--fg);border-radius:22px;padding:18px}
.form.open{display:grid;gap:12px}
.form label{display:grid;gap:4px;font-size:14px;font-weight:600}
.form input[type=text],.form select{font:400 16px var(--sans);color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg .chip{font-size:13px;padding:6px 12px}
.form .urgck{display:flex;align-items:center;gap:8px;font-weight:600}
.form .urgck input{accent-color:var(--profundo);width:18px;height:18px}
.form .actions{display:flex;gap:10px;flex-wrap:wrap}
.form .err{color:var(--profundo);font-size:14px;min-height:1em;margin:0}
.acts{display:flex;gap:14px;margin-top:4px}
.act{background:none;border:0;color:var(--muted);font:600 13px var(--sans);cursor:pointer;padding:0;text-decoration:underline}
.mine{font:400 13px var(--serif);font-style:italic;color:var(--muted)}
@media (max-width:480px){ .form .two{grid-template-columns:1fr} }
.empty{font-family:var(--serif);font-size:20px;color:var(--muted);padding:12px 4px}

footer{margin-top:48px;font-family:var(--serif);font-size:18px;color:var(--muted);text-align:center}
@media (max-width:480px){ .toggle{margin-left:0;width:100%} h2{font-size:23px} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="sig" aria-label="m&a"><span class="m">m</span><span class="amp">&amp;</span><span class="a">a.</span></h1>
    <p class="sub" id="sub">qué rollo con la boda</p>
    <div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="meter">
      <div class="fill" id="fill"></div>
      <div class="txt"><span id="pct">0%</span><span id="cnt"></span></div>
    </div>
    <p class="sync" id="sync">Cargando…</p>
    <button class="addbtn" id="openForm" aria-expanded="false">+ Agregar tarea</button>
    <form class="form" id="form" autocomplete="off">
      <label>Tarea<input type="text" id="fText" maxlength="140" placeholder="Ej. Recoger los manteles con Karen"></label>
      <div class="two">
        <label>Área<select id="fArea"></select></label>
        <label>Con quién (opcional)<input type="text" id="fHelp" list="helpList" placeholder="Separa con comas"></label>
      </div>
      <datalist id="helpList"></datalist>
      <div><div style="font-size:14px;font-weight:600;margin-bottom:6px">Responsable</div>
        <div class="seg" id="fWho">
          <button type="button" class="chip" data-w="A" aria-pressed="true">Alfredo</button>
          <button type="button" class="chip" data-w="M" aria-pressed="false">Mitzi</button>
          <button type="button" class="chip" data-w="AM" aria-pressed="false">Los dos</button>
          <button type="button" class="chip" data-w="N" aria-pressed="false">Sin asignar</button>
        </div></div>
      <div class="two">
        <label>Día<select id="fDay"></select></label>
        <label>Nota (opcional)<input type="text" id="fNote" maxlength="140"></label>
      </div>
      <label class="urgck"><input type="checkbox" id="fUrg"> Es urgente</label>
      <p class="err" id="fErr"></p>
      <div class="actions"><button class="addbtn" type="submit" id="fSubmit" style="margin:0">Agregar tarea</button>
        <button type="button" class="chip" id="closeForm">Cancelar</button></div>
    </form>
  </header>

  <div class="controls" role="toolbar" aria-label="Filtrar tareas">
    <div class="rrow" id="rrow">
    <button class="chip" data-f="all" aria-pressed="true">Todas</button>
    <button class="chip" data-f="A" aria-pressed="false">Alfredo</button>
    <button class="chip" data-f="M" aria-pressed="false">Mitzi</button>
    <button class="chip" data-f="N" aria-pressed="false">Sin asignar</button>
    <label class="toggle"><input type="checkbox" id="hide"> Ocultar las hechas</label>
    </div>
    <div class="hrow drow" id="drow" aria-label="Filtrar por día"></div>
    <div class="hrow" id="hrow" aria-label="Filtrar por quién apoya"></div>
  </div>

  <main id="list"></main>
  <footer>la fusión del año · 3 de octubre</footer>
</div>

let done = {}, custom = [], over = {};
try { done = JSON.parse(localStorage.getItem(LS) || "{}") || {}; } catch(e){ done = {}; }
try { custom = JSON.parse(localStorage.getItem(LSC) || "[]") || []; } catch(e){ custom = []; }
try { over = JSON.parse(localStorage.getItem(LSO) || "{}") || {}; } catch(e){ over = {}; }
// Filtros múltiples: dentro de cada grupo basta con cumplir uno; entre grupos se deben cumplir todos
const fWho = new Set(), fHelp = new Set(), fDay = new Set();
let hideDone = false, db = null, newWho = "A", editingId = null;

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// tarea personalizada: {id, area, text, who, note, urg, help:[], day}
// over: cambios a tareas de la lista base, {id: {area, text, who, note, urg, help, day} | {deleted:true}}
const all = () => T.filter(t => !(over[t[0]] && over[t[0]].deleted)).map(t => {
  const o = over[t[0]];
  return o ? [t[0], o.area, o.text, o.who, o.note||"", o.urg?1:0, o.help||[], "day" in o ? o.day : (D[t[0]]||"")] : [t[0], t[1], t[2], t[3], t[4]||"", t[5]||0, H[t[0]]||[], D[t[0]]||""];
}).concat(custom.map(c => [c.id, c.area, c.text, c.who, c.note||"", c.urg?1:0, c.help||[], c.day||""]));
const findTask = id => all().find(t => t[0] === id);
const helpersOf = t => t[6] || [];

const todayKey = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const filtering = () => fWho.size || fHelp.size || fDay.size;
function visible(t){
  if (fWho.size && ![...fWho].some(f => f === "N" ? t[3] === "N" : (t[3] === f || t[3] === "AM"))) return false;
  if (fHelp.size && !helpersOf(t).some(n => fHelp.has(n))) return false;
  if (fDay.size && !fDay.has(t[7] || "none")) return false;
  if (hideDone && done[t[0]]) return false;
  return true;
}
function rowHTML(t){
  const d = !!done[t[0]], hp = helpersOf(t);
  return `<li class="row${d?" done":""}" tabindex="0" role="checkbox" aria-checked="${d}" data-id="${t[0]}">
    <span class="box"><svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></svg></span>
    <span class="task"><span class="t">${esc(t[2])}</span>${t[7]&&DAYNAME[t[7]]?` <span class="dia">${DAYNAME[t[7]]}</span>`:""}${t[4]?`<span class="note">${esc(t[4])}</span>`:""}${hp.length?`<span class="help">con ${esc(hp.join(", "))}</span>`:""}<span class="acts"><button class="act" data-edit="${t[0]}">Editar</button><button class="act" data-del="${t[0]}">Eliminar</button></span></span>
    <span class="who ${t[3]}">${WHO[t[3]]}</span></li>`;
}
function sectionHTML(key, title, items, extra){
  const vis = items.filter(visible);
  const n = items.filter(t => done[t[0]]).length;
  if (!items.length || (!vis.length && filtering())) return "";
  const complete = n === items.length;
  return `<section class="${extra||""}${complete?" complete":""}" data-sec="${key}">
    <h2>${esc(title)} <span class="count">${n}/${items.length}</span><span class="done-tag">fusionada</span></h2>
    <ul>${vis.length ? vis.map(rowHTML).join("") : `<li class="empty">Todo listo aquí.</li>`}</ul></section>`;
}
function itemsOf(k){ const A = all(); return k === "urg" ? A.filter(t => t[5]) : A.filter(t => t[1] === k); }
function render(){
  let h = sectionHTML("urg","Urgente esta semana", itemsOf("urg"), "urg");
  for (const [k,title] of AREAS) h += sectionHTML(k, title, itemsOf(k));
  $("#list").innerHTML = h;
  updateMeter(); buildHelpers(); buildDays(); syncWhoChips();
}
function updateMeter(){
  const A = all(), n = A.filter(t => done[t[0]]).length, p = A.length ? Math.round(n / A.length * 100) : 0;
  $("#fill").style.width = p + "%";
  $("#pct").textContent = p + "%";
  $("#cnt").textContent = `${n} de ${A.length} listas`;
  $("#meter").setAttribute("aria-valuenow", p);
}
function countdown(){
  const today = new Date(); today.setHours(0,0,0,0);
  const days = Math.round((new Date(2026,9,3) - today) / 864e5);
  $("#sub").innerHTML = days > 1 ? `qué rollo con la boda: faltan <b>${days} días</b>`
    : days === 1 ? `qué rollo con la boda: es <b>mañana</b>`
    : days === 0 ? `qué rollo con la boda: es <b>hoy</b>` : `qué rollo con la boda: <b>ya fue</b>`;
}
function saveLocal(){ try { localStorage.setItem(LS, JSON.stringify(done)); localStorage.setItem(LSC, JSON.stringify(custom)); localStorage.setItem(LSO, JSON.stringify(over)); } catch(e){} }

async function toggle(id){
  done[id] = !done[id];
  saveLocal();
  document.querySelectorAll(`.row[data-id="${id}"]`).forEach(r => {
    r.classList.toggle("done", !!done[id]); r.setAttribute("aria-checked", !!done[id]);
  });
  refreshCounts();
  if (hideDone && done[id]) setTimeout(render, 600);
  if (db){
    try { await db.collection("checks").doc(id).set({done: !!done[id], at: Date.now()}); }
    catch(e){ $("#sync").textContent = "No se pudo guardar el cambio para todos. Se quedó en este navegador."; }
  }
}
function refreshCounts(){
  document.querySelectorAll("section[data-sec]").forEach(s => {
    const items = itemsOf(s.dataset.sec);
    const n = items.filter(t => done[t[0]]).length;
    s.querySelector(".count").textContent = `${n}/${items.length}`;
    s.classList.toggle("complete", n === items.length);
  });
  updateMeter();
}

// Filtro de apoyo (se recalcula al agregar tareas)
function buildHelpers(){
  const c = {};
  all().forEach(t => helpersOf(t).forEach(n => c[n] = (c[n]||0) + 1));
  const names = Object.keys(c).sort((a,b) => c[b]-c[a] || a.localeCompare(b,"es"));
  for (const n of fHelp) if (!c[n]) fHelp.delete(n);
  $("#hrow").innerHTML = `<span class="lbl">con</span>` + names.map(n => `<button class="chip" aria-pressed="${fHelp.has(n)}" data-h="${esc(n)}">${esc(n)} <span style="opacity:.6">${c[n]}</span></button>`).join("");
  $("#helpList").innerHTML = names.map(n => `<option value="${esc(n)}">`).join("");
}
$("#hrow").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  const n = b.dataset.h; fHelp.has(n) ? fHelp.delete(n) : fHelp.add(n);
  render();
});

// Filtro por día
function buildDays(){
  const c = {}, today = todayKey();
  all().forEach(t => { const k = DAYNAME[t[7]] ? t[7] : "none"; c[k] = (c[k]||0) + 1; });
  const chip = (k, label) => `<button class="chip" aria-pressed="${fDay.has(k)}" data-d="${k}">${label}${k===today?` <span class="hoy">hoy</span>`:""} <span style="opacity:.6">${c[k]||0}</span></button>`;
  $("#drow").innerHTML = `<span class="lbl">día</span>` + DAYS.map(([k,l]) => chip(k, l)).join("") + chip("none", "Sin día");
}
$("#drow").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  const k = b.dataset.d; fDay.has(k) ? fDay.delete(k) : fDay.add(k);
  render();
});

$("#list").addEventListener("click", e => {
  const act = e.target.closest(".act");
  if (act){ e.stopPropagation(); act.dataset.edit ? startEdit(act.dataset.edit) : removeTask(act.dataset.del); return; }
  const r = e.target.closest(".row"); if (r) toggle(r.dataset.id);
});
$("#list").addEventListener("keydown", e => {
  if (e.target.closest(".act")) return;
  const r = e.target.closest(".row"); if (r && (e.key === " " || e.key === "Enter")){ e.preventDefault(); toggle(r.dataset.id); }
});
// "Todas" limpia todos los filtros; los responsables se pueden combinar
function syncWhoChips(){
  document.querySelectorAll("#rrow .chip").forEach(x => x.setAttribute("aria-pressed", x.dataset.f === "all" ? !filtering() : fWho.has(x.dataset.f)));
}
document.querySelectorAll("#rrow .chip").forEach(b => b.addEventListener("click", () => {
  const f = b.dataset.f;
  if (f === "all"){ fWho.clear(); fHelp.clear(); fDay.clear(); }
  else fWho.has(f) ? fWho.delete(f) : fWho.add(f);
  render();
}));
$("#hide").addEventListener("change", e => { hideDone = e.target.checked; render(); });

// Formulario de nueva tarea
$("#fDay").innerHTML = `<option value="">Sin día</option>` + DAYS.map(([k,l]) => `<option value="${k}">${l}</option>`).join("");
$("#fArea").innerHTML = AREAS.map(([k,t]) => `<option value="${k}">${esc(t)}</option>`).join("");
function resetForm(){
  editingId = null;
  $("#fText").value = ""; $("#fNote").value = ""; $("#fHelp").value = ""; $("#fDay").value = ""; $("#fUrg").checked = false;
  $("#fErr").textContent = ""; $("#fSubmit").textContent = "Agregar tarea";
  setWho("A");
}
function setWho(w){
  newWho = w;
  $("#fWho").querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x.dataset.w === w));
}
function openForm(open){
  if (!open) resetForm();
  $("#form").classList.toggle("open", open);
  $("#openForm").style.display = open ? "none" : "";
  $("#openForm").setAttribute("aria-expanded", open);
  if (open) $("#fText").focus();
}
$("#openForm").addEventListener("click", () => openForm(true));
$("#closeForm").addEventListener("click", () => openForm(false));
$("#fWho").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (b) setWho(b.dataset.w);
});
function startEdit(id){
  const t = findTask(id); if (!t) return;
  resetForm(); editingId = id;
  $("#fText").value = t[2]; $("#fArea").value = t[1]; $("#fNote").value = t[4];
  $("#fHelp").value = helpersOf(t).join(", "); $("#fUrg").checked = !!t[5]; $("#fDay").value = DAYNAME[t[7]] ? t[7] : ""; setWho(t[3]);
  $("#fSubmit").textContent = "Guardar cambios";
  openForm(true);
  $("#form").scrollIntoView({block:"center", behavior:"smooth"});
}
$("#form").addEventListener("submit", async e => {
  e.preventDefault();
  const text = $("#fText").value.trim();
  if (!text){ $("#fErr").textContent = "Escribe la tarea para agregarla."; return; }
  $("#fErr").textContent = "";
  const fields = {
    area: $("#fArea").value, text, who: newWho,
    note: $("#fNote").value.trim(), urg: $("#fUrg").checked, day: $("#fDay").value,
    help: $("#fHelp").value.split(",").map(x => x.trim()).filter(Boolean).map(x => x[0].toUpperCase() + x.slice(1))
  };
  const editId = editingId;
  let id, data;
  if (!editId){
    id = "u" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
    data = {...fields, at: Date.now()};
    custom.push({id, ...data});
  } else if (BASE.has(editId)){
    // Los cambios a tareas base se guardan como documento en "tasks" con el mismo id
    id = editId; data = {...fields, at: Date.now()};
    over[id] = fields;
  } else {
    const c = custom.find(c => c.id === editId); if (!c){ openForm(false); return; }
    Object.assign(c, fields);
    ({id, ...data} = c);
  }
  saveLocal(); render();
  openForm(false);
  const row = document.querySelector(`.row[data-id="${id}"]`);
  if (row){ row.scrollIntoView({block:"center", behavior:"smooth"}); row.focus({preventScroll:true}); }
  if (db){
    try { await db.collection("tasks").doc(id).set(data); }
    catch(err){ $("#sync").textContent = editId ? "El cambio se guardó solo en este navegador." : "La tarea se guardó solo en este navegador."; }
  }
});
async function removeTask(id){
  const t = findTask(id); if (!t) return;
  if (!confirm(`¿Eliminar “${t[2]}”?`)) return;
  const base = BASE.has(id);
  if (base) over[id] = {deleted: true}; else custom = custom.filter(c => c.id !== id);
  delete done[id]; saveLocal();
  if (editingId === id) openForm(false);
  render();
  if (db){
    try {
      if (base) await db.collection("tasks").doc(id).set({deleted: true, at: Date.now()});
      else await db.collection("tasks").doc(id).delete();
      await db.collection("checks").doc(id).delete();
    }
    catch(err){ $("#sync").textContent = "No se pudo eliminar para todos."; }
  }
}

countdown(); render();
$("#sync").textContent = "Conectando…";

(async () => {
  db = await Promise.race([window.fbReady, new Promise(r => setTimeout(() => r(null), 8000))]);
  if (!db){ $("#sync").textContent = "Sin conexión a la lista compartida. Los cambios se guardan en este navegador."; return; }
  $("#sync").textContent = "Sincronizando…";
  const ok = () => { $("#sync").textContent = "Sincronizado: lo que marque, agregue o edite uno lo ve el otro."; };
  const fail = () => { $("#sync").textContent = "Sin conexión a la lista compartida. Los cambios se guardan en este navegador."; };
  db.collection("checks").onSnapshot(snap => {
    const next = {};
    snap.docs.forEach(d => { const v = d.data(); if (v && v.done) next[d.id] = true; });
    done = next; saveLocal(); render(); ok();
  }, fail);
  db.collection("tasks").orderBy("at").onSnapshot(snap => {
    const nextCustom = [], nextOver = {};
    snap.docs.forEach(d => {
      const v = d.data() || {};
      if (BASE.has(d.id) && v.deleted){ nextOver[d.id] = {deleted: true}; return; }
      const c = {area: AREAS.some(a => a[0] === v.area) ? v.area : "log", text: String(v.text || ""),
        who: WHO[v.who] ? v.who : "N", note: String(v.note || ""), urg: !!v.urg,
        help: Array.isArray(v.help) ? v.help.map(String) : []};
      if (v.day !== undefined) c.day = DAYNAME[v.day] ? v.day : "";
      if (!c.text) return;
      if (BASE.has(d.id)) nextOver[d.id] = c; else nextCustom.push({id: d.id, ...c, at: v.at || 0});
    });
    custom = nextCustom; over = nextOver;
    saveLocal(); render(); ok();
  }, fail);
})();
</script>
